; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Code lives where STM32CubeMX (FlightController.ioc) generates it.
[platformio]
src_dir = Core/Src
include_dir = Core/Inc

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube

upload_protocol = stlink
debug_tool = stlink

extra_scripts = pre:tools/cubemx_cleanup.py


; App/ and USB_DEVICE/ sit next to Core/ at the project root (not under
; Core/Src|Inc), so pull their sources and headers in explicitly.
build_src_filter =
    +<*>
    +<../../App/*.cpp>
    +<../../USB_DEVICE/App/*.c>
    +<../../USB_DEVICE/Target/*.c>
build_flags =
    -IApp
    -IUSB_DEVICE/App
    -IUSB_DEVICE/Target