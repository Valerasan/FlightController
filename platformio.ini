; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Code lives where STM32CubeMX (FlightController.ioc) generates it.
[platformio]
src_dir = Core/Src
include_dir = Core/Inc

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube

upload_protocol = stlink
debug_tool = stlink

extra_scripts = pre:tools/cubemx_cleanup.py


; App/, USB_DEVICE/, and the vendored lsm6ds3-pid driver sit next to Core/
; at the project root (not under Core/Src|Inc), so pull them in explicitly.
; (lsm6ds3-pid lives in lib/, but its header is only reachable through
; App/Inc's raw -I flag, which the LDF doesn't walk when deciding which
; lib/ folders to link - so it's listed here rather than relying on
; auto-detection.)
build_src_filter =
    +<*>
    +<../../App/Src/*.cpp>
    +<../../USB_DEVICE/App/*.c>
    +<../../USB_DEVICE/Target/*.c>
    +<../../lib/lsm6ds3-pid/*.c>
build_flags =
    -IApp/Inc
    -IUSB_DEVICE/App
    -IUSB_DEVICE/Target
    -Ilib/lsm6ds3-pid
    ; newlib-nano's vsnprintf strips %f support by default (--specs=nano.specs);
    ; without this, LOG("...%.1f...") silently prints blank/garbage for floats.
    -Wl,-u,_printf_float